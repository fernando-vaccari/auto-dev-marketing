name: Validate Auto Posts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install offline Reels tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng
      - run: python -m pip install -r requirements.txt -r requirements-integrations.txt -r requirements-reels-kokoro.txt
      - uses: actions/cache@v4
        with:
          path: .data/reels/models/kokoro
          key: kokoro-v1-release-v1.1-beb0d1848dee9a49
      - run: python scripts/install_voice.py
      - run: python -m pip check
      - run: python -m unittest discover -v
        env:
          REELS_REQUIRE_TOOLS: '1'
          REELS_REQUIRE_NEURAL: '1'
      - run: node --check app/web/app.js && node --check app/web/login.js && node --check app/web/reels.js && node --check app/web/studio.js && node --check app/web/my-voice.js
      - name: Install browser test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - run: python scripts/browser_smoke.py
      - run: python scripts/reels_browser_smoke.py
      - run: python scripts/studio_browser_smoke.py
      - run: python scripts/my_voice_browser_smoke.py
